name: Deploy Website to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Copy All Project Files to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "index.html,docker-compose.yml,prometheus/prometheus.yml"
        target: "/home/ubuntu/project/"

    - name: Executing remote ssh commands to deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |

          sudo docker stop my-nginx-container || true
          sudo docker rm my-nginx-container || true
          sudo docker run -d --name my-nginx-container -p 8080:80 -v /home/ubuntu/website:/usr/share/nginx/html nginx
          sudo docker-compose down || true
          sudo docker-compose up -d 
